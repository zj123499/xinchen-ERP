<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120">
  <!-- Newill 新辰未来 Logo -->
  <!-- 左侧 N 字母图形（带向左箭头） -->
  <g transform="translate(10, 5)">
    <!-- N 左竖 -->
    <rect x="0" y="0" width="14" height="80" fill="#2563EB"/>
    <!-- 左箭头 -->
    <polygon points="14,30 36,30 36,22 50,40 36,58 36,50 14,50" fill="#2563EB"/>
    <!-- N 斜线 -->
    <polygon points="14,0 28,0 56,52 56,80 42,80 14,28" fill="#2563EB"/>
    <!-- 右箭头 -->
    <polygon points="56,30 78,30 78,22 92,40 78,58 78,50 56,50" fill="#60A5FA"/>
  </g>
  <!-- 文字 newill -->
  <text x="115" y="58" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#2563EB" letter-spacing="-1">newill</text>
  <!-- 文字 新辰未来 -->
  <text x="115" y="95" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" fill="#2563EB" letter-spacing="3">新辰未来</text>
</svg>