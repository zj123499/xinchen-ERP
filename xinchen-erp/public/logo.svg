<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 110" width="320" height="110">
  <!-- Newill 新辰未来 Logo -->

  <!-- 左侧 N 字母图形 -->
  <g transform="translate(10, 10)">
    <!-- N 左竖 -->
    <rect x="0" y="0" width="13" height="80" fill="#2563EB"/>

    <!-- N 斜线（从左下到右上） -->
    <polygon points="0,0 18,0 70,80 52,80" fill="#2563EB"/>

    <!-- N 右竖 -->
    <rect x="57" y="0" width="13" height="80" fill="#2563EB"/>

    <!-- 左箭头（指向左） -->
    <polygon points="5,15 35,15 35,8 50,22 35,36 35,29 5,29" fill="#3B82F6"/>

    <!-- 右箭头（指向右，浅蓝） -->
    <polygon points="28,55 56,55 56,48 71,62 56,76 56,69 28,69" fill="#93C5FD"/>
  </g>

  <!-- newill 文字 -->
  <text x="100" y="58" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#2563EB" letter-spacing="-1">newill</text>

  <!-- 新辰未来 文字 -->
  <text x="100" y="92" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" fill="#2563EB" letter-spacing="3">新辰未来</text>
</svg>