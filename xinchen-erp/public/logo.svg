<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 110" width="320" height="110">
  <!-- Newill 新辰未来 Logo -->

  <!-- 左侧 N 字母 + 箭头组合 -->
  <g transform="translate(8, 10)">
    <!-- 左竖条 -->
    <rect x="0" y="0" width="13" height="90" fill="#2563EB"/>

    <!-- 左箭头（指向左，从 N 上半部伸出） -->
    <polygon points="13,22 38,22 38,14 56,32 38,50 38,42 13,42" fill="#2563EB"/>

    <!-- N 对角线（从左下到右上的斜线） -->
    <polygon points="13,90 13,62 56,0 56,28 32,62 32,90" fill="#2563EB"/>

    <!-- 右侧箭头（指向右，颜色较浅） -->
    <polygon points="56,44 78,44 78,36 96,54 78,72 78,64 56,64" fill="#93C5FD"/>
  </g>

  <!-- newill 文字 -->
  <text x="120" y="58" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#2563EB" letter-spacing="-1">newill</text>

  <!-- 新辰未来 文字 -->
  <text x="120" y="92" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" fill="#2563EB" letter-spacing="3">新辰未来</text>
</svg>